services:
  koha-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: koha-agent-uabc:latest
    container_name: koha_agent_uabc
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./models:/app/models

  # tunel opcional para pruebas remotas sin tocar el router
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: koha_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://koha-agent:5000
    depends_on:
      - koha-agent
